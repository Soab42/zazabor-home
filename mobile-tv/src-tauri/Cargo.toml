[package]
name = "zazabor-tv"
version = "0.2.1"
description = "Zazabor TV for Android"
edition = "2021"

# The phone app builds on its own: the desktop crate's libraries (GStreamer, PDFium, pty…) don't
# build for Android. The catalog and Live TV are the desktop's `src-tauri/src/tv`, compiled in by path.
[workspace]

[lib]
name = "zazabor_tv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
ureq = "=3.4.2"
sha2 = "0.10"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
opt-level = "s"
