<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Zazabor TV icon, in the Zazabor Home family. Android launcher icons: npx tauri icon mobile-tv/src-tauri/icons/icon.svg -o <scratch>, then copy its android/mipmap-*/ic_launcher*.png into gen/android/app/src/main/res (the foregrounds from icon-foreground.svg). -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#343945"/><stop offset="1" stop-color="#101217"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.10"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.52"><stop offset="0" stop-color="#ff6b8a" stop-opacity="0.26"/><stop offset="1" stop-color="#ff6b8a" stop-opacity="0"/></radialGradient>
    <linearGradient id="screen" gradientUnits="userSpaceOnUse" x1="250" y1="300" x2="780" y2="700"><stop offset="0" stop-color="#7ab4ff"/><stop offset="1" stop-color="#2d63e6"/></linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe6f5"/></linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/></filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/></filter>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>
  <g filter="url(#drop)"><rect x="100" y="100" width="824" height="824" rx="186" fill="url(#body)"/></g>
  <g clip-path="url(#squircle)"><rect x="100" y="100" width="824" height="824" fill="url(#glow)"/></g>
  <rect x="102" y="102" width="820" height="820" rx="184" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <!-- a TV: blue screen with a white play triangle, on two little feet -->
  <g filter="url(#lift)">
    <path d="M400 790 L440 730 M624 790 L584 730" stroke="#ffc46b" stroke-width="30" stroke-linecap="round"/>
    <rect x="232" y="296" width="560" height=" 400" rx="76" fill="#141821"/>
    <rect x="256" y="320" width="512" height="352" rx="56" fill="url(#screen)"/>
    <path d="M256 376 q0-56 56-56 h400 q56 0 56 56 v6 h-512z" fill="#ffffff" fill-opacity="0.16"/>
    <path d="M458 424 L458 568 Q458 586 474 577 L592 509 Q608 500 592 491 L474 415 Q458 406 458 424z" fill="url(#play)"/>
  </g>
</svg>
